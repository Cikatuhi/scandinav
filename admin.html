<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка — Скандинав</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-screen" id="login-screen"><form id="login-form"><span class="eyebrow">СКАНДИНАВ / ADMIN</span><h1>Вход для владельца</h1><p>Введите пароль, чтобы управлять контентом сайта.</p><label>Пароль<input id="admin-password" type="password" autocomplete="current-password" required /></label><button class="button primary" type="submit">Войти</button><div class="login-error" id="login-error">Неверный пароль</div></form></div>
  <main class="admin-shell">
    <header class="admin-header">
      <div><span class="eyebrow">СКАНДИНАВ / CONTENT</span><h1>Управление сайтом</h1><p>Меняйте фотографии и данные проектов без редактирования кода.</p></div>
      <div class="admin-actions"><a class="view-link" href="index.html" target="_blank">Открыть сайт ↗</a><button class="logout" id="logout" type="button">Выйти</button></div>
    </header>

    <form id="content-form">
      <section class="panel">
        <div class="panel-heading"><span>01</span><h2>Первый экран</h2></div>
        <label>Ссылка на фото<input name="heroImage" type="text" placeholder="https://..." /></label>
        <label>Или загрузите файл<input name="heroFile" type="file" accept="image/*" /></label>
        <div class="preview hero-preview" data-preview="heroImage"></div>
      </section>

      <section class="panel">
        <div class="panel-heading"><span>02</span><h2>Проекты</h2></div>
        <div id="projects"></div>
        <button class="add-project" id="add-project" type="button">+ Добавить проект</button>
      </section>

      <section class="panel">
        <div class="panel-heading"><span>03</span><h2>Контакты компании</h2></div>
        <div class="two-col"><label>Телефон<input name="companyPhone" type="text" placeholder="+7 495 123-45-67" /></label><label>Email<input name="companyEmail" type="email" placeholder="hello@skandinav.house" /></label></div>
        <div class="two-col"><label>Telegram<input name="companyTelegram" type="text" placeholder="https://t.me/..." /></label><label>WhatsApp<input name="companyWhatsapp" type="text" placeholder="https://wa.me/..." /></label></div>
        <div class="two-col"><label>График работы<input name="companyHours" type="text" placeholder="Пн—Пт · 09:00—19:00" /></label><label>Регион работы<input name="companyRegion" type="text" placeholder="Москва и область" /></label></div>
      </section>

      <div class="actions"><button class="button primary" type="submit">Сохранить изменения</button><button class="button" id="preview" type="button">Предпросмотр</button><button class="button" id="reset" type="button">Сбросить</button><span id="status" role="status"></span></div>
    </form>
  </main>
  <script src="admin.js"></script>
</body>
</html>
